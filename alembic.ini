# Database migrations for the store-operations application.
#
#   alembic upgrade head                       # uses DATABASE_URL / DQ_ENV settings
#   alembic -x url=postgresql+psycopg://... upgrade head
#   python -m dqstack.app.manage migrate       # the same, from the app's own CLI
#
# The database address is never written here; it comes from the environment, so
# this file is safe to commit and identical in every environment.

[alembic]
script_location = %(here)s/dqstack/app/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
