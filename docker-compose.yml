# DQ-Stack on one server: PostgreSQL, the application, the scheduler, HTTPS and
# nightly backups. Copy .env.example to .env, fill it in, then:
#
#   docker compose up -d --build
#   docker compose run --rm app manage create-platform-admin --email you@company.in --name "You"
#
# See deploy/README.md for the full guide, backups, restores and upgrades.

name: dqstack

x-app: &app
  build: .
  image: dqstack:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DQ_ENV: production
    DQ_INLINE_JOBS: "false"
    DATABASE_URL: postgresql+psycopg://dqstack_app:${DQ_APP_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    db: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DQ_OWNER_PASSWORD: ${DQ_OWNER_PASSWORD}
      DQ_APP_PASSWORD: ${DQ_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: dqstack:latest
    env_file: .env
    environment:
      DQ_ENV: production
      DATABASE_URL: postgresql+psycopg://dqstack_owner:${DQ_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    <<: *app
    command: ["web"]
    expose: ["8000"]
    volumes:
      - planner-data:/srv/dqstack/ui/data

  worker:
    <<: *app
    command: ["worker"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DQ_DOMAIN: ${DQ_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - backups:/backups
      - ./deploy/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "/usr/local/bin/backup-loop.sh"]

volumes:
  pgdata:
  planner-data:
  caddy-data:
  caddy-config:
  backups:
