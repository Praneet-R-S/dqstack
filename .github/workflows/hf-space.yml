# Publish to the Hugging Face Space after CI passes on main (deploy/HUGGINGFACE.md).
#
# Needs, under GitHub > Settings > Secrets and variables > Actions:
#   secret   HF_TOKEN   a Hugging Face access token with write permission
#   variable HF_SPACE   the Space, as owner/name (for example your-name/dqstack)
# Without HF_SPACE it does nothing, so the repository works the same without a Space.

name: hugging face space

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Hugging Face client
        run: python -m pip install "huggingface_hub>=0.35,<1"

      - name: Publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_hf.py --space "${{ vars.HF_SPACE }}"
