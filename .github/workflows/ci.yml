# CI for DQ-Stack.
#
# The specification is blunt about why this exists: "budgets that are not automated
# are wishes." The leakage tests and the simulator conservation tests are named in the
# definition of done as things that must pass *in CI*, not on a developer's machine —
# and the defect history bears that out, since eleven of the roughly thirty defects
# found in this project were silent and would never have surfaced from a run that
# merely completed without raising.
#
# Three jobs:
#   tests     the whole suite on SQLite: engine, planner interface, application server
#   postgres  every application test again on PostgreSQL 16, the production database,
#             then the migrations applied to an empty database and checked against
#             the models
#   smoke     the forecasting pipeline end to end, its run invariants, and the tests
#             that need the exported bundle
#
# torch comes from the CPU-only index: the engine needs it for NHITS, and the
# default PyPI wheel on Linux drags in several gigabytes of CUDA libraries.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DQ_ENV: test

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt

      - name: Source files must be valid UTF-8
        # A locale-encoded write corrupted a source file once already; a byte that
        # only fails on some platforms is worth catching mechanically.
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for p in list(pathlib.Path("dqstack").rglob("*.py")) + list(pathlib.Path("tests").rglob("*.py")):
              try:
                  p.read_bytes().decode("utf-8")
              except UnicodeDecodeError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all source files are valid UTF-8")
          PY

      - name: Compile
        run: python -m compileall -q dqstack tests

      - name: Unit, contract and application tests (SQLite)
        # Includes the leakage suite (origin invariance, purged splits, mask
        # integrity), the simulator suite (conservation, non-negativity, closed form,
        # monotonicity, overage realisability), the stage-boundary contracts, and the
        # application server's step tests.
        run: python -m pytest tests/ -q --durations=10

      - name: Frontend syntax
        run: |
          for f in ui/js/*.js; do node --check "$f"; done
          if [ -d webapp/js ]; then for f in webapp/js/*.js; do node --check "$f"; done; fi
          echo "javascript parses"

      - name: Production refuses unsafe settings
        run: |
          ! DQ_ENV=production python -c "import dqstack.app.config" 2>/dev/null

  postgres:
    name: application on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dq
          POSTGRES_PASSWORD: dq-ci-only
          POSTGRES_DB: dq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dq -d dq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DQ_TEST_POSTGRES_URL: postgresql+psycopg://dq:dq-ci-only@localhost:5432/dq_test
      PGPASSWORD: dq-ci-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt

      - name: Every application test on PostgreSQL
        env:
          DQ_APP_TESTS_ON_POSTGRES: "1"
        run: python -m pytest tests/app -q --durations=10

      - name: Migrations apply to an empty database and match the models
        run: |
          psql -h localhost -U dq -d dq_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic -x url="$DQ_TEST_POSTGRES_URL" upgrade head
          alembic -x url="$DQ_TEST_POSTGRES_URL" check

  image:
    name: production image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t dqstack:ci .
      - name: The application imports inside the image
        run: docker run --rm -e DQ_ENV=test --entrypoint python dqstack:ci -c "import dqstack.app.main, dqstack.app.worker, dqstack.live; print('ok')"
      - name: Production refuses to start with unsafe settings
        run: |
          ! docker run --rm dqstack:ci manage check
      - name: The whole stack comes up with PostgreSQL and serves the health check
        run: |
          cat > .env <<'ENV'
          DQ_DOMAIN=localhost
          DQ_SECRET_KEY=ci-only-secret-key-that-is-long-enough-1234567890
          DQ_PUBLIC_URL=https://localhost
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres-pw
          POSTGRES_DB=dqstack
          DQ_OWNER_PASSWORD=ci-owner-pw
          DQ_APP_PASSWORD=ci-app-pw
          ENV
          docker compose up -d --build db migrate app worker
          for i in $(seq 1 60); do
            docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 3
          done
          docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health
          docker compose exec -T app python -m dqstack.app.manage check
          docker compose logs --no-color migrate | tail -20
          docker compose down -v

  smoke:
    name: end-to-end smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The pipeline must run start to finish from one command. This is a reduced
    # configuration -- the point is that no stage raises and every artifact is
    # written, not that the numbers are final.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - name: Generate the panel
        run: python -m dqstack.data.generate
      - name: Stage 0 quality gate
        run: python -m dqstack.ingest
      - name: Full pipeline (quick)
        run: python -m dqstack.pipeline --quick --export
      - name: Every declared artifact must exist
        run: |
          python - <<'PY'
          import json, pathlib, sys
          required = [
              "metrics.json", "leaderboard.csv", "fva_ladder.csv", "fva_by_class.csv",
              "coverage_table.csv", "economics.csv", "decision_ledger.parquet",
              "backtest_per_origin.csv", "backtest_summary.json",
              "cost_sensitivity.csv", "feed_runs.json",
          ]
          missing = [f for f in required if not (pathlib.Path("artifacts") / f).exists()]
          if missing:
              print("missing artifacts:", missing); sys.exit(1)
          if not pathlib.Path("ui/data/bundle.js").exists():
              print("UI bundle not exported"); sys.exit(1)

          m = json.loads(pathlib.Path("artifacts/metrics.json").read_text())
          # Assertions on the run itself, not on its accuracy. These are the
          # invariants a completed run must satisfy however good the forecast is.
          sim = m["simulator_totals"]
          assert sim["conservation_residual"] < 1e-6, sim["conservation_residual"]
          assert sim["min_on_hand"] >= -1e-9, sim["min_on_hand"]
          assert m["mint_projection_error"] < 1e-6, m["mint_projection_error"]
          assert 0.0 <= sim["fill_rate"] <= 1.0
          print("all artifacts present; run invariants hold")
          PY
      - name: Tests that need the exported bundle
        # Skipped in the tests job, where no bundle exists; here one does.
        run: python -m pytest tests/test_cost_curve.py tests/test_vocabulary.py -q -rs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-artifacts
          path: artifacts/
