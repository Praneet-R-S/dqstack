# Every push and pull request runs the whole suite twice: once on SQLite (the
# engine, the planner interface and the app) and once with every app test on
# PostgreSQL 16, the production database. Then the migrations are applied to an
# empty PostgreSQL and checked against the models.
name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dq
          POSTGRES_PASSWORD: dq-ci-only
          POSTGRES_DB: dq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dq -d dq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DQ_ENV: test
      DQ_TEST_POSTGRES_URL: postgresql+psycopg://dq:dq-ci-only@localhost:5432/dq_test
      PGPASSWORD: dq-ci-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt

      - name: Tests on SQLite (engine, planner, app)
        run: python -m pytest -q

      - name: App tests on PostgreSQL
        env:
          DQ_APP_TESTS_ON_POSTGRES: "1"
        run: python -m pytest -q tests/app

      - name: Migrations apply to an empty PostgreSQL and match the models
        run: |
          psql -h localhost -U dq -d dq_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic -x url="$DQ_TEST_POSTGRES_URL" upgrade head
          alembic -x url="$DQ_TEST_POSTGRES_URL" check

      - name: Production refuses unsafe settings
        run: |
          ! DQ_ENV=production python -c "import dqstack.app.config" 2>/dev/null
